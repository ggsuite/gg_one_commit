name: gg_one_commit
description: "Daily repo flows of the gg_one tool family - committing, pushing, upgrading dependencies and creating ticket branches."
version: 2.6.1
repository: https://github.com/ggsuite/gg_one_commit.git

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  args: ^2.7.0
  gg_args: ^3.2.0
  gg_changelog: ^2.2.1
  gg_console_colors: ^2.5.0
  gg_git: ^4.4.2
  gg_lang: ^0.8.1
  gg_log: ^1.2.0
  gg_one_core: ^2.8.1
  gg_process: ^1.3.0
  gg_publish: ^4.7.1
  gg_status_printer: ^1.6.1
  matcher: ^0.12.20
  mocktail: ^1.0.5
  path: ^1.9.1

dev_dependencies:
  gg_capture_print: ^1.2.0
  lints: ^6.1.0
  test: ^1.32.0
  gg_test: ^3.3.2
  gg_version: ^5.5.1
  dna_ggsuite: ^0.2.2
  helix: ^1.9.0
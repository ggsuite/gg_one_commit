name: gg_one_commit
description: "Daily repo flows of the gg_one tool family - committing, pushing, upgrading dependencies and creating ticket branches."
version: 2.2.3
repository: https://github.com/ggsuite/gg_one_commit.git

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  args: ^2.7.0
  gg_args: ^3.0.1
  gg_changelog: ^2.0.1
  gg_console_colors: ^2.3.1
  gg_git: ^4.1.2
  gg_lang: ^0.5.1
  gg_log: ^1.0.7
  gg_one_core: ^2.4.1
  gg_process: ^1.1.7
  gg_publish: ^4.3.2
  gg_status_printer: ^1.4.3
  matcher: ^0.12.20
  mocktail: ^1.0.5
  path: ^1.9.1

dev_dependencies:
  gg_capture_print: ^1.0.10
  lints: ^6.1.0
  test: ^1.31.2
  gg_test: ^3.1.1
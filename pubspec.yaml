version: 2.10.0
repository: https://github.com/ggsuite/gg_one_commit.git

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  args: ^2.7.0
  gg_args: ^3.2.0
  gg_changelog: ^2.2.5
  gg_console_colors: ^2.5.0
  gg_git: ^4.8.1
  gg_lang: ^0.8.4
  gg_log: ^1.2.0
  gg_one_core: ^2.17.0
  gg_process: ^1.4.1
  gg_publish: ^4.10.3
  gg_status_printer: ^1.6.4
  matcher: ^0.12.20
  mocktail: ^1.0.5
  path: ^1.9.1

dev_dependencies:
  gg_capture_print: ^1.2.1
  lints: ^6.1.0
  test: ^1.33.0
  gg_test: ^3.3.5
  gg_version: ^5.7.3
  dna_ggsuite: ^1.0.2
  helix: ^1.14.0